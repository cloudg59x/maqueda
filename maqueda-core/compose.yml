# Development: only Postgres runs in Docker. Next.js and the worker run on the host
# (native HMR on macOS, no stale node_modules volumes). See README.md "Quick start".
#
#   npm run db:up                     -> postgres only
#   docker compose --profile tools up -> + adminer on http://localhost:8080
#   docker compose --profile full up  -> production-like: app + worker in containers

services:
  postgres:
    image: postgres:16-alpine
    container_name: maqueda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: maqueda
    ports:
      # Host port 5433 on purpose: a Homebrew Postgres often already owns 5432 on macOS.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maqueda"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    container_name: maqueda-adminer
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: app
    container_name: maqueda-app
    profiles: ["full"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/maqueda?schema=public
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    container_name: maqueda-worker
    profiles: ["full"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/maqueda?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
