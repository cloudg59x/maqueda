<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maqueda</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
        }
        
        .loader-container {
            text-align: center;
        }
        
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .message {
            font-size: 18px;
            color: #333;
        }
        
        /* Payment page styles */
        .payment-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .payment-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .payment-header h1 {
            margin: 0;
            font-size: 24px;
            color: #333;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        .usd-preview {
            text-align: right;
            font-size: 14px;
            color: #777;
            margin-top: 5px;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            margin-top: 10px;
        }
        
        .btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background-color: #95a5a6;
        }
        
        .confirmation-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        
        .confirmation-item:last-child {
            border-bottom: none;
        }
        
        .confirmation-label {
            color: #777;
            font-size: 14px;
        }
        
        .confirmation-value {
            text-align: right;
            font-weight: 500;
        }
        
        .back-btn {
            background: none;
            border: none;
            color: #3498db;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
            padding: 0;
        }
        
        .testnet-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #f39c12;
            color: #1a1a1a;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            padding: 6px 10px;
            letter-spacing: 0.04em;
            z-index: 10;
        }

        .error {
            color: #c0392b;
            text-align: center;
        }

        .status {
            text-align: center;
            padding: 40px 20px;
        }

        .status-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .status a {
            color: #3498db;
        }

        .signature-result {
            margin-top: 20px;
            word-break: break-all;
        }

        .loader-container .btn {
            max-width: 320px;
        }

        .network-warning {
            display: block;
            color: #c0392b;
            font-size: 12px;
            font-weight: normal;
        }

        .status details {
            margin: 12px 0;
            font-size: 12px;
            color: #777;
        }

        .status details code {
            display: block;
            margin-top: 6px;
            text-align: left;
            word-break: break-all;
        }

        body.has-debug-panel {
            padding-bottom: 30vh;
            box-sizing: border-box;
        }

        .debug-panel {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            max-height: 30vh;
            overflow: auto;
            margin: 0;
            padding: 8px 10px;
            background: rgba(0, 0, 0, 0.85);
            color: #9be79b;
            font: 11px/1.4 Menlo, Consolas, monospace;
            white-space: pre-wrap;
            word-break: break-all;
            z-index: 20;
        }

        .total-usd {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <!-- Loading screen -->
    <div class="loader-container" id="loader-container">
        <div class="loader"></div>
        <div class="message">Checking wallet compatibility...</div>
    </div>
    
    <!-- Payment screens container -->
    <div class="payment-container" id="payment-container" style="display: none;">
        <!-- Screen 1: Send details -->
        <div id="send-screen">
            <div class="payment-header">
                <h1 id="send-title">Send USDC</h1>
            </div>
            
            <div class="form-group">
                <label for="receiver-address">Receiver Address</label>
                <input type="text" id="receiver-address" placeholder="0x…" autocomplete="off" spellcheck="false">
            </div>
            
            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="number" id="amount" placeholder="0.00" step="0.01" min="0">
                <div class="usd-preview" id="usd-preview">≈ $0.00</div>
            </div>
            
            <button class="btn" id="next-btn" disabled>Next</button>
        </div>
        
        <!-- Screen 2: Confirmation -->
        <div id="confirmation-screen" style="display: none;">
            <button class="back-btn" id="back-btn">← Back</button>
            
            <div class="payment-header">
                <h1>Confirm Transaction</h1>
            </div>
            
            <div class="confirmation-item">
                <div class="confirmation-label">Token</div>
                <div class="confirmation-value" id="confirm-token">USDC</div>
            </div>
            
            <div class="confirmation-item">
                <div class="confirmation-label">From</div>
                <div class="confirmation-value" id="confirm-from">…</div>
            </div>
            
            <div class="confirmation-item">
                <div class="confirmation-label">To</div>
                <div class="confirmation-value" id="confirm-to">…</div>
            </div>
            
            <div class="confirmation-item">
                <div class="confirmation-label">Amount</div>
                <div class="confirmation-value" id="confirm-amount">0.00 USDC</div>
            </div>
            
            <div class="confirmation-item">
                <div class="confirmation-label">Network</div>
                <div class="confirmation-value" id="confirm-network">Ethereum</div>
            </div>
            
            <div class="confirmation-item">
                <div class="confirmation-label">Estimated Network Fee</div>
                <div class="confirmation-value" id="confirm-fee">…</div>
            </div>
            
            <div class="confirmation-item">
                <div class="confirmation-label">Transaction nonce</div>
                <div class="confirmation-value" id="confirm-nonce">…</div>
            </div>
            
            <div class="total-usd" id="total-usd"></div>
            
            <button class="btn" id="confirm-btn">Confirm</button>
        </div>
    </div>

    <script src="./scripts/config.js"></script>
    <script src="./scripts/script.js"></script>
</body>
</html>
